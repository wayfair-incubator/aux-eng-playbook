name: validate

on:
  pull_request:

jobs:
  validate-build:
    runs-on: ubuntu-latest
    container:
      image: node:19-alpine
    steps:
      - uses: actions/checkout@v7
      - name: 🔧 install + build # This project is built using npm and outputs the result to the 'build' folder
        run: |
          yarn
          yarn build-prefix
